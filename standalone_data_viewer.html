<!DOCTYPE html>
<html>
<head>
  <title>Website Time & Actions Report</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    ul { padding-left: 20px; }
  </style>
</head>
<body>
  <h2>Today's Summary</h2>
  <ul id="list"></ul>
  
  <h2>User Actions</h2>
  <ul id="actions-list"></ul>
  
  <input type="file" id="fileInput">
  <script>
    const fileInput = document.getElementById('fileInput');
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          renderData(data.browsingData, data.userActions);
        } catch (error) {
          console.error("Error parsing JSON:", error);
          alert("Invalid file. Please select a valid JSON file.");
        }
      };
      reader.readAsText(file);
    });

    function renderData(browsingData, userActions) {
      const list = document.getElementById('list');
      list.innerHTML = '';
      if (browsingData) {
        Object.entries(browsingData).forEach(([domain, ms]) => {
          const totalSec = Math.floor(ms / 1000);
          const h = Math.floor(totalSec / 3600);
          const m = Math.floor((totalSec % 3600) / 60);
          const li = document.createElement('li');
          li.textContent = `${domain}: ${h}h ${m}m`;
          list.appendChild(li);
        });
      }

      const actionsList = document.getElementById('actions-list');
      actionsList.innerHTML = '';
      if (userActions) {
        Object.entries(userActions).forEach(([domain, actions]) => {
          const domainHeader = document.createElement('h3');
          domainHeader.textContent = domain;
          actionsList.appendChild(domainHeader);
          const ul = document.createElement('ul');
          actions.forEach(action => {
            const li = document.createElement('li');
            li.textContent = `${new Date(action.timestamp).toLocaleTimeString()}: ${action.action} on ${action.elementTag} with text "${action.elementText}"`;
            ul.appendChild(li);
          });
          actionsList.appendChild(ul);
        });
      }
    }
  </script>
</body>
</html>
